version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: identity-vault-db
    environment:
      POSTGRES_DB: identity_vault
      POSTGRES_USER: vault_user
      POSTGRES_PASSWORD: secure_password_change_me
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vault_user"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - identity-vault

  # Backend API
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: identity-vault-api
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://vault_user:secure_password_change_me@postgres:5432/identity_vault
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ALLOWED_ORIGINS: http://localhost:3000,http://localhost:3001,http://localhost:8080
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - identity-vault
    restart: unless-stopped

  # Telegram Bot
  bot:
    build:
      context: ./telegram-bot
      dockerfile: Dockerfile
    container_name: identity-vault-bot
    environment:
      NODE_ENV: production
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      API_URL: http://api:3000
      MINI_APP_URL: http://localhost:8080
      WEBHOOK_URL: http://localhost:3001
      PORT: 3001
    ports:
      - "3001:3001"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - identity-vault
    restart: unless-stopped

  # Redis Cache (optional, for session management)
  redis:
    image: redis:7-alpine
    container_name: identity-vault-cache
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - identity-vault
    restart: unless-stopped

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: identity-vault-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - api
      - bot
    networks:
      - identity-vault
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  identity-vault:
    driver: bridge
